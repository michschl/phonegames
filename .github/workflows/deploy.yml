name: Deploy

# Every push to main is tested, packaged as a Docker image (GitHub Container
# Registry) and rolled out to the Infomaniak VPS via SSH.
# "Run workflow" with an image tag re-deploys an older version (rollback).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image-Tag für ein Rollback (Commit-SHA). Leer lassen = aktuellen Stand bauen und ausrollen.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  image:
    name: Docker-Image bauen & pushen
    needs: ci
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Image-Namen bestimmen
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Bei der GitHub Container Registry anmelden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Bauen
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${{ steps.meta.outputs.image }}:${GITHUB_SHA}" \
            --tag "${{ steps.meta.outputs.image }}:latest" \
            .

      - name: Pushen
        run: docker push --all-tags "${{ steps.meta.outputs.image }}"

      # The narrator voice (Piper + voice models) rarely changes: its tag is a
      # checksum of tts/, so it is only rebuilt when that folder changes.
      - name: TTS-Image bauen & pushen (nur bei Änderungen)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-tts:$(cat tts/* | sha256sum | cut -c1-16)"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE ist schon vorhanden"
          else
            docker build \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "$IMAGE" tts
            docker push "$IMAGE"
          fi

  deploy:
    name: Auf den VPS ausrollen
    needs: image
    # Runs after a successful build, or directly for a rollback. Skipped until
    # the VPS is configured (repository variable VPS_HOST).
    if: always() && vars.VPS_HOST != '' && (needs.image.result == 'success' || (needs.image.result == 'skipped' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/phonegames' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      REDIRECT_DOMAINS: ${{ vars.REDIRECT_DOMAINS }}
      IMAGE_TAG: ${{ inputs.image_tag || needs.image.outputs.tag }}
      INFOMANIAK_AI_PRODUCT_ID: ${{ vars.INFOMANIAK_AI_PRODUCT_ID }}
      LEARN_AI_MODEL: ${{ vars.LEARN_AI_MODEL }}
      LEARN_MONTHLY_LIMIT: ${{ vars.LEARN_MONTHLY_LIMIT }}
      LEARN_GLOBAL_MONTHLY_LIMIT: ${{ vars.LEARN_GLOBAL_MONTHLY_LIMIT }}
    steps:
      - uses: actions/checkout@v5

      - name: Konfiguration prüfen
        env:
          HAS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          INVITE_CODES: ${{ secrets.INVITE_CODES }}
          INFOMANIAK_AI_TOKEN: ${{ secrets.INFOMANIAK_AI_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          missing=0
          for v in VPS_HOST APP_DOMAIN IMAGE_TAG; do
            if [ -z "${!v}" ]; then echo "::error::Variable $v fehlt"; missing=1; fi
          done
          if [ "$HAS_SSH_KEY" != "true" ]; then echo "::error::Secret VPS_SSH_KEY fehlt"; missing=1; fi
          domains_pattern='^[A-Za-z0-9.-]+([ ,]+[A-Za-z0-9.-]+)*$'
          if [ -n "$REDIRECT_DOMAINS" ] && ! [[ "$REDIRECT_DOMAINS" =~ $domains_pattern ]]; then
            echo "::error::REDIRECT_DOMAINS: Domains mit Komma trennen, z. B. «phonegames.ch, www.phonegames.ch»."
            missing=1
          fi
          codes_pattern='^[A-Za-z0-9_, -]+$'
          if [ -z "$INVITE_CODES" ]; then
            echo "::warning::Secret INVITE_CODES fehlt – die Registrierung ist für alle offen."
          elif ! [[ "$INVITE_CODES" =~ $codes_pattern ]]; then
            echo "::error::INVITE_CODES darf nur Buchstaben, Ziffern, - und _ enthalten (mehrere Codes mit Komma trennen)."
            missing=1
          fi
          if [ -z "$INFOMANIAK_AI_TOKEN" ]; then
            echo "::warning::Secret INFOMANIAK_AI_TOKEN fehlt – die Foto-Auswertung für Lernstapel ist ausgeschaltet (Abtippen geht)."
          else
            if ! [[ "$INFOMANIAK_AI_TOKEN" =~ ^[A-Za-z0-9._~+/=-]+$ ]]; then
              echo "::error::INFOMANIAK_AI_TOKEN enthält ungültige Zeichen (Leerzeichen oder Zeilenumbruch mitkopiert?)."
              missing=1
            fi
            if ! [[ "$INFOMANIAK_AI_PRODUCT_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Variable INFOMANIAK_AI_PRODUCT_ID fehlt oder ist keine Zahl (Produkt-ID der Infomaniak AI Tools)."
              missing=1
            fi
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::warning::Secret STRIPE_SECRET_KEY fehlt – kein Abo: neue Konten nur mit Einladungscode."
          elif ! [[ "$STRIPE_SECRET_KEY" =~ ^(sk|rk)_(live|test)_[A-Za-z0-9]+$ ]]; then
            echo "::error::STRIPE_SECRET_KEY sieht nicht nach einem Stripe-Schlüssel aus (sk_live_… oder sk_test_…; Leerzeichen mitkopiert?)."
            missing=1
          elif [[ "$STRIPE_SECRET_KEY" == *_test_* ]]; then
            echo "::warning::STRIPE_SECRET_KEY ist ein Test-Schlüssel – Zahlungen laufen im Stripe-Testmodus, es fliesst kein Geld."
          fi
          for v in LEARN_MONTHLY_LIMIT LEARN_GLOBAL_MONTHLY_LIMIT; do
            if [ -n "${!v}" ] && ! [[ "${!v}" =~ ^[0-9]+$ ]]; then echo "::error::Variable $v muss eine ganze Zahl sein."; missing=1; fi
          done
          if [ -n "$LEARN_AI_MODEL" ] && ! [[ "$LEARN_AI_MODEL" =~ ^[A-Za-z0-9._/:-]+$ ]]; then
            echo "::error::Variable LEARN_AI_MODEL enthält ungültige Zeichen."
            missing=1
          fi
          exit $missing

      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Secret VPS_KNOWN_HOSTS fehlt – Host-Key wird ungeprüft übernommen (Trust on first use)."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            Port $VPS_PORT
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Dateien übertragen
        env:
          INVITE_CODES: ${{ secrets.INVITE_CODES }}
          INFOMANIAK_AI_TOKEN: ${{ secrets.INFOMANIAK_AI_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TTS_TAG="$(cat tts/* | sha256sum | cut -c1-16)"
          umask 077
          {
            echo "APP_IMAGE=${IMAGE}:${IMAGE_TAG}"
            echo "TTS_IMAGE=${IMAGE}-tts:${TTS_TAG}"
            echo "APP_VERSION=${IMAGE_TAG::7}"
            echo "APP_DOMAIN=${APP_DOMAIN}"
            # "a.ch b.ch" or "a.ch,b.ch" -> "a.ch, b.ch" (Caddy site addresses)
            if [ -n "$REDIRECT_DOMAINS" ]; then echo "REDIRECT_DOMAINS=\"$(echo "$REDIRECT_DOMAINS" | tr ', ' '\n\n' | grep -v '^$' | paste -sd, - | sed 's/,/, /g')\""; fi
            echo "INVITE_CODES=${INVITE_CODES// /}"
            if [ -n "$INFOMANIAK_AI_TOKEN" ]; then
              echo "INFOMANIAK_AI_TOKEN=${INFOMANIAK_AI_TOKEN}"
              echo "INFOMANIAK_AI_PRODUCT_ID=${INFOMANIAK_AI_PRODUCT_ID}"
            fi
            for v in LEARN_AI_MODEL LEARN_MONTHLY_LIMIT LEARN_GLOBAL_MONTHLY_LIMIT; do
              if [ -n "${!v}" ]; then echo "$v=${!v}"; fi
            done
            if [ -n "$STRIPE_SECRET_KEY" ]; then echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"; fi
          } > deploy/.env
          if ! ssh vps "mkdir -p '$APP_DIR' 2>/dev/null && test -w '$APP_DIR'"; then
            echo "::error::$APP_DIR fehlt auf dem VPS oder ist nicht beschreibbar. Einmalig als root anlegen: sudo install -d -m 750 -o $VPS_USER -g $VPS_USER $APP_DIR"
            exit 1
          fi
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh deploy/.env "vps:$APP_DIR/"

      - name: Container aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          # The short-lived workflow token is passed via stdin and removed after the pull.
          printf '%s' "$GH_TOKEN" | ssh vps "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"
          # Our images must be pulled. Caddy comes from Docker Hub, which limits anonymous pulls per
          # IP address (429 Too Many Requests) – then the image already on the server stays.
          ssh vps "cd '$APP_DIR' && chmod +x backup.sh && chmod 600 .env \
            && docker compose pull app tts \
            && { docker compose pull caddy || echo '::warning::Caddy konnte nicht von Docker Hub geladen werden – das vorhandene Image bleibt.'; } \
            && docker compose up -d --remove-orphans --wait --wait-timeout 120; \
            status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
          ssh vps "docker image prune -af --filter 'until=168h' >/dev/null || true"

      - name: Health-Check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${APP_DOMAIN}/api/health"; then echo; echo "✅ https://${APP_DOMAIN} läuft"; exit 0; fi
            echo "Warte auf ${APP_DOMAIN} … ($i/20)"; sleep 6
          done
          echo "::error::Health-Check fehlgeschlagen"
          ssh vps "cd '$APP_DIR' && docker compose ps && docker compose logs --tail 80"
          exit 1

      - name: Weiterleitungen prüfen
        if: env.REDIRECT_DOMAINS != ''
        run: |
          # New domains need a few seconds for their certificate – this only warns.
          for domain in $(echo "$REDIRECT_DOMAINS" | tr ',' ' '); do
            ok=0
            for i in $(seq 1 10); do
              location=$(curl -s -o /dev/null -w '%{redirect_url}' "https://${domain}/" || true)
              if [ "$location" = "https://${APP_DOMAIN}/" ]; then ok=1; break; fi
              sleep 6
            done
            if [ $ok = 1 ]; then echo "✅ https://${domain} → https://${APP_DOMAIN}"; continue; fi
            echo "::warning::https://${domain} leitet (noch) nicht weiter – zeigt der DNS-Eintrag auf den VPS?"
            # Diagnosis: DNS compared with the main domain, CAA and Caddy's certificate errors.
            echo "DNS ${APP_DOMAIN}: A=$(dig +short A "$APP_DOMAIN" | paste -sd' ' -) AAAA=$(dig +short AAAA "$APP_DOMAIN" | paste -sd' ' -)"
            echo "DNS ${domain}: A=$(dig +short A "$domain" | paste -sd' ' -) AAAA=$(dig +short AAAA "$domain" | paste -sd' ' -) CAA=$(dig +short CAA "$domain" | paste -sd' ' -)"
            ssh vps "cd '$APP_DIR' && docker compose logs caddy --since 15m 2>&1 | grep -i '$domain' | grep -iE 'error|fail|challenge' | tail -5" || true
          done
