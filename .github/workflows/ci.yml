name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  # Also used as the first stage of the deploy workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker-Image bauen (ohne Push)
        if: github.event_name == 'pull_request'
        run: docker build --tag plausch:ci .
