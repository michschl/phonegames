<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6e9" />
    <meta name="description" content="Phonegames – 30 Spiele fürs Handy: Partyspiele für die ganze Runde, Spiele allein und in 3D, dazu Lernen mit eigenen Lernkarten und Aufgaben. Funktioniert auch offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Phonegames" />
    <link rel="icon" href="/icons/phoni.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/phoni-180.png" />
    <title>Phonegames – Partyspiele fürs Handy</title>
    <!-- The first thing on screen while the app loads: Phoni pops up instead of an empty page. React replaces it. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        background: #fff6e9;
      }
      .boot svg {
        animation: boot-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .boot__word {
        font: 900 30px/1 'Unbounded Variable', 'Arial Rounded MT Bold', system-ui, sans-serif;
        letter-spacing: -0.03em;
        color: #1b1033;
        animation: boot-pop 0.6s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .boot__word span {
        color: #ff4fa3;
      }
      .boot__dots {
        display: flex;
        gap: 7px;
        margin-top: 8px;
      }
      .boot__dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #1b1033;
        animation: boot-dot 0.9s 0.5s ease-in-out infinite both;
      }
      .boot__dots i:nth-child(2) {
        animation-delay: 0.62s;
        background: #ff4fa3;
      }
      .boot__dots i:nth-child(3) {
        animation-delay: 0.74s;
        background: #ffd23f;
      }
      @keyframes boot-pop {
        from {
          opacity: 0;
          transform: scale(0.5) rotate(-10deg);
        }
      }
      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-7px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <svg width="132" height="132" viewBox="-6 -6 132 132">
          <rect x="36" y="18" width="64" height="100" rx="17" fill="#1b1033" />
          <rect x="28" y="10" width="64" height="100" rx="17" fill="#ff4fa3" stroke="#1b1033" stroke-width="4.5" />
          <rect x="52" y="15" width="16" height="4" rx="2" fill="#1b1033" />
          <rect x="35" y="22" width="50" height="74" rx="10" fill="#ffd23f" stroke="#1b1033" stroke-width="3.5" />
          <circle cx="60" cy="103" r="3.5" fill="#1b1033" />
          <ellipse cx="50" cy="56" rx="4.2" ry="5.2" fill="#1b1033" />
          <ellipse cx="70" cy="56" rx="4.2" ry="5.2" fill="#1b1033" />
          <circle cx="42" cy="68" r="4.5" fill="#ff4fa3" opacity="0.55" />
          <circle cx="78" cy="68" r="4.5" fill="#ff4fa3" opacity="0.55" />
          <path d="M49 74 Q60 86 71 74" stroke="#1b1033" stroke-width="3.8" stroke-linecap="round" fill="none" />
        </svg>
        <div class="boot__word">phone<span>games</span></div>
        <div class="boot__dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <noscript>Phonegames braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
