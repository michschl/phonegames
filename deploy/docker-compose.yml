# Production stack on the VPS: the app container behind Caddy (automatic HTTPS).
# Values come from the .env file next to this file, written by the deploy workflow.
name: phonegames

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE fehlt}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INVITE_CODES: ${INVITE_CODES:-}
      # Passkeys are bound to this address.
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN fehlt}
      # Narrator voice (Piper), only reachable inside this stack.
      TTS_URL: http://tts:5000
    volumes:
      - app-data:/data
    expose:
      - '3000'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Natural German narrator voice (Piper TTS). Not exposed to the internet –
  # the app calls it and caches every rendered sentence.
  tts:
    image: ${TTS_IMAGE:?TTS_IMAGE fehlt}
    restart: unless-stopped
    expose:
      - '5000'
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN fehlt}
      # Domains that redirect to APP_DOMAIN, e.g. "phonegames.ch, www.phonegames.ch".
      # The placeholder only listens on port 80 for a name that never resolves.
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-http://redirect.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  app-data:
  caddy-data:
  caddy-config:
